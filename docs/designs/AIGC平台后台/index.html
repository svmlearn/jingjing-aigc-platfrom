<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>静境平台管理台</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { amber: { 400:'#fbbf24', 500:'#f59e0b', 600:'#d97706', 700:'#b45309' } }
        }
      }
    };
  </script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #050505; color: #e0e0e0; overflow: hidden; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
    .animate-in { animation: fadeSlideIn 0.25s ease-out; }
    .fade-in { animation: fadeIn 0.2s ease; }
    .slide-in-from-bottom-2 { animation: slideUp 0.25s ease-out; }
    @keyframes fadeSlideIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes slideUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .bg-white\/3 { background: rgba(255,255,255,0.03); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="./tweaks-panel.jsx"></script>
  <script type="text/babel" src="./shared.jsx"></script>
  <script type="text/babel" src="./pages-a.jsx"></script>
  <script type="text/babel" src="./pages-b.jsx"></script>
  <script type="text/babel" src="./app.jsx"></script>

      <rect x="4" y="26" width="16" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
      <rect x="4" y="33" width="16" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
      <rect x="4" y="40" width="16" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>

      <rect x="32" y="52" width="80" height="20" rx="3" fill="#0d0d0d"/>
