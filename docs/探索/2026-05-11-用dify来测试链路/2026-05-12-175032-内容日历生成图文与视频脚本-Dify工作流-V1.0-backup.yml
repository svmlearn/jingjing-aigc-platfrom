    - data:
        code: |
          import json
          import re
          
          RISK_TERMS = [
              "投资回报率高", "租金回报高", "收益稳定", "稳赚", "保值增值", "闭眼买", "错过后悔",
              "满租", "租金区间", "租金回报", "低位价格", "价格错位", "确定兑现", "运营成熟验证",
              "收租", "贴月供", "租出去", "保租", "保回报"
          ]
          
          def clean_json(value):
              text = (value or "").strip()
              if text.startswith("```"):
                  text = re.sub(r"^```(?:json)?\s*", "", text)
                  text = re.sub(r"\s*```$", "", text)
              return text
          
          def parse_obj(value):
              if isinstance(value, dict):
                  return value
              if not isinstance(value, str):
                  return {}
          
              text = clean_json(value)
              if "</think>" in text:
                  text = text.rsplit("</think>", 1)[-1].strip()
          
              for candidate in [text] + [text[index:].strip() for index, char in enumerate(text) if char == "{"]:
                  try:
                      parsed = json.loads(clean_json(candidate))
                      return parsed if isinstance(parsed, dict) else {}
                  except Exception:
                      continue
              return {}
          
          def parse_list(value):
              if isinstance(value, list):
                  return value
              if isinstance(value, str):
                  try:
                      parsed = json.loads(value or "[]")
                      return parsed if isinstance(parsed, list) else []
                  except Exception:
                      return []
              return []
          
          def as_list(value):
              return value if isinstance(value, list) else []
          
          def non_empty(value):
              if isinstance(value, list):
                  return len(value) > 0
              return bool(str(value or "").strip())
          
          def main(article_json, video_json, image_assets_json: str, fallback_knowledge_text: str) -> dict:
              article = parse_obj(article_json)
              video = parse_obj(video_json)
              image_assets = parse_list(image_assets_json)
              scenes = as_list(video.get("scenes"))
          
              public_text = json.dumps({
                  "articlePackage": article,
                  "videoScript": video,
              }, ensure_ascii=False)
              risk_hits = [term for term in RISK_TERMS if term in public_text]
              needs_rewrite = bool(risk_hits)
          
              scores = {
                  "factAccuracy": 8,
                  "projectFit": 8,
                  "viralStructure": 8,
                  "platformTone": 8,
                  "materialFit": 8,
                  "compliance": 9,
              }
              problems = []
              revision_suggestions = []
              red_flags = []
              missing_inputs = []
          
              if risk_hits:
                  scores["compliance"] = 4
                  problems.append("公开成稿存在风险承诺类或价格趋势类表述")
                  red_flags.append("命中风险词：" + "、".join(risk_hits))
          
              copy_ready = str(article.get("copyReadyText") or "").strip()
              if not copy_ready:
                  scores["platformTone"] = min(scores["platformTone"], 6)
                  problems.append("copyReadyText 为空，不能直接复制发布")
          
              titles = article.get("titles")
              if not isinstance(titles, list) or not titles:
                  scores["platformTone"] = min(scores["platformTone"], 6)
                  problems.append("titles 为空")
          
              hashtags = article.get("hashtags")
              if not isinstance(hashtags, list) or not hashtags:
                  scores["platformTone"] = min(scores["platformTone"], 6)
                  problems.append("hashtags 为空")
          
              weak_knowledge = "只有很少资料" in str(fallback_knowledge_text or "")
              if weak_knowledge:
                  scores["factAccuracy"] = min(scores["factAccuracy"], 5)
                  problems.append("项目知识不足，成稿仅适合内部预览")
                  missing_inputs.append("更完整的项目事实")
          
              if not image_assets:
                  scores["materialFit"] = min(scores["materialFit"], 6)
                  problems.append("缺少可用图片素材")
                  missing_inputs.append("图文图片素材")
          
              empty_asset_queries = [
                  str(scene.get("sceneNo", index + 1))
                  for index, scene in enumerate(scenes)
                  if not str(scene.get("assetQuery") or "").strip()
              ]
              if empty_asset_queries:
                  scores["materialFit"] = min(scores["materialFit"], 5)
                  problems.append("部分视频场景缺少 assetQuery")
          
              upload_required_scenes = [
                  scene for scene in scenes if scene.get("uploadRequired") is True
              ]
              required_uploads = video.get("requiredUploads")
              if upload_required_scenes and not non_empty(required_uploads):
                  scores["materialFit"] = min(scores["materialFit"], 5)
                  problems.append("存在成员补拍场景，但 requiredUploads 为空")
          
              team_asset_scenes = [
                  scene for scene in scenes if scene.get("assetSourceHint") == "team_video_asset"
              ]
              optional_assets = video.get("optionalTeamVideoAssets")
              if team_asset_scenes and not non_empty(optional_assets):
                  scores["materialFit"] = min(scores["materialFit"], 6)
                  problems.append("存在团队视频素材场景，但 optionalTeamVideoAssets 为空")
          
              if not scenes:
                  scores["materialFit"] = min(scores["materialFit"], 5)
                  problems.append("视频镜头脚本为空")
          
              passed = all(value >= 7 for value in scores.values()) and not red_flags and not missing_inputs and not problems
          
              out = {
                  "scores": scores,
                  "pass": passed,
                  "needsRewrite": needs_rewrite,
                  "riskTerms": risk_hits,
                  "problems": problems,
                  "revisionSuggestions": revision_suggestions,
                  "redFlags": red_flags,
                  "missingInputs": missing_inputs,
              }
              return {
                  "text": json.dumps(out, ensure_ascii=False),
                  "needs_rewrite": "true" if needs_rewrite else "false",
                  "risk_terms": "、".join(risk_hits),
              }
