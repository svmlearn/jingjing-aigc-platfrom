    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 汇总知识库、爆款结构和图片素材，先定创作策略。
        model:
          completion_params:
            temperature: 0.25
            top_p: 0.85
          mode: chat
          name: deepseek-v4-pro
