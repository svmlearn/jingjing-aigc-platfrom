          enabled: false
          variable_selector: []
        desc: 把内容日历任务转成检索 query 和生成约束。
        model:
          completion_params:
            temperature: 0.2
            top_p: 0.8
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: task-understanding-system
          role: system
          text: |
            你是房地产内容生产工作流中的“任务理解节点”。
            你只负责把输入的内容日历任务解析为可检索、可生成的结构化任务，不写正文、不写脚本。

            硬约束：
            1. 只能基于输入内容解析，不要编造项目事实。
            2. 输出必须是严格 JSON，不要 Markdown，不要解释。
            3. 所有字段都要保留；未知则填空字符串、空数组或 null。
            4. copySearchQuery、scriptSearchQuery、imageSearchQuery 不能为空；必须把主题、客群、卖点、场景词组合成中文检索句。
            5. 如果输入出现租金回报、收益、升值、投资、满租、租金区间、低位价格、价格错位等词，只能把它们归类放入 riskConstraints，不要当成可直接宣传的卖点。
            6. riskConstraints 只能输出类别标签，例如“收益承诺类”“出租确定性类”“价格趋势类”“投资属性类”，不要复述输入里的原始风险词。
            7. copySearchQuery、scriptSearchQuery、imageSearchQuery 不要包含上述风险词；改用“预算友好、成熟配套、空间使用、生活便利、项目实景”等安全检索词。
        - id: task-understanding-user
          role: user
          text: |+
            内容日历任务：
            {{#start.calendar_task_json#}}

            额外要求：
            {{#start.extra_requirement#}}

            请输出 JSON：

