    - data:
        code: |
          import json
          import re

          RISK_TERMS = [
              "投资回报率高", "租金回报高", "收益稳定", "稳赚", "保值增值", "闭眼买", "错过后悔",
              "满租", "租金区间", "租金回报", "低位价格", "价格错位", "确定兑现", "运营成熟验证",
              "收租", "贴月供", "租出去", "保租", "保回报"
          ]

          def clean_json(value):
              text = (value or "").strip()
              if text.startswith("```"):
                  text = re.sub(r"^```(?:json)?\s*", "", text)
                  text = re.sub(r"\s*```$", "", text)
              return text

          def parse_obj(value):
              if isinstance(value, dict):
                  return value
              if not isinstance(value, str):
                  return {}

              text = clean_json(value)
              if "</think>" in text:
                  text = text.rsplit("</think>", 1)[-1].strip()

              for candidate in [text] + [text[index:].strip() for index, char in enumerate(text) if char == "{"]:
                  try:
                      parsed = json.loads(clean_json(candidate))
                      return parsed if isinstance(parsed, dict) else {}
                  except Exception:
                      continue
              return {}

          def parse_list(value):
              if isinstance(value, list):
                  return value
              if isinstance(value, str):
                  try:
                      parsed = json.loads(value or "[]")
                      return parsed if isinstance(parsed, list) else []
                  except Exception:
                      return []
              return []

          def as_list(value):
              return value if isinstance(value, list) else []

          def non_empty(value):
              if isinstance(value, list):
                  return len(value) > 0
              return bool(str(value or "").strip())

          def extract_video_delivery(value):
              obj = parse_obj(value)
              if isinstance(obj.get("videoScript"), dict):
                  return obj
              if isinstance(obj.get("scenes"), list) or isinstance(obj.get("narrative"), dict):
                  return {"videoScript": obj}
              return {"videoScript": {}}

          def main(article_json, video_json, image_assets_json: str, fallback_knowledge_text: str) -> dict:
              article = parse_obj(article_json)
              video_delivery = extract_video_delivery(video_json)
              video = video_delivery.get("videoScript") if isinstance(video_delivery.get("videoScript"), dict) else {}
              narrative = video.get("narrative") if isinstance(video.get("narrative"), dict) else {}
              scenes = as_list(video.get("scenes"))
              image_assets = parse_list(image_assets_json)

              public_text = json.dumps({
                  "articlePackage": article,
                  "videoDelivery": video_delivery,
              }, ensure_ascii=False)
              risk_hits = [term for term in RISK_TERMS if term in public_text]
              needs_rewrite = bool(risk_hits)

              scores = {
                  "factAccuracy": 8,
                  "projectFit": 8,
                  "viralStructure": 8,
                  "platformTone": 8,
                  "materialFit": 8,
                  "compliance": 9,
              }
              problems = []
              revision_suggestions = []
              red_flags = []
              missing_inputs = []

              if risk_hits:
                  scores["compliance"] = 4
                  problems.append("公开成稿存在风险承诺类或价格趋势类表述")
                  red_flags.append("命中风险词：" + "、".join(risk_hits))

              copy_ready = str(article.get("copyReadyText") or "").strip()
              if not copy_ready:
                  scores["platformTone"] = min(scores["platformTone"], 6)
                  problems.append("copyReadyText 为空，不能直接复制发布")

              titles = article.get("titles")
              if not isinstance(titles, list) or not titles:
                  scores["platformTone"] = min(scores["platformTone"], 6)
                  problems.append("titles 为空")

              hashtags = article.get("hashtags")
              if not isinstance(hashtags, list) or not hashtags:
                  scores["platformTone"] = min(scores["platformTone"], 6)
                  problems.append("hashtags 为空")

              weak_knowledge = "只有很少资料" in str(fallback_knowledge_text or "")
              if weak_knowledge:
                  scores["factAccuracy"] = min(scores["factAccuracy"], 5)
                  problems.append("项目知识不足，成稿仅适合内部预览")
                  missing_inputs.append("更完整的项目事实")

              if not image_assets:
                  scores["materialFit"] = min(scores["materialFit"], 6)
                  problems.append("缺少可用图片素材")
                  missing_inputs.append("图文图片素材")

              hook = narrative.get("hook") if isinstance(narrative.get("hook"), dict) else {}
              if not str(hook.get("openingLine") or "").strip():
                  scores["viralStructure"] = min(scores["viralStructure"], 6)
                  problems.append("视频叙事缺少前 3 秒钩子 openingLine")

              narrative_arc = as_list(narrative.get("narrativeArc"))
              if len(narrative_arc) < 3:
                  scores["viralStructure"] = min(scores["viralStructure"], 6)
                  problems.append("视频叙事弧线少于 3 个节拍")

              if not str(narrative.get("bgmDirection") or "").strip():
                  scores["materialFit"] = min(scores["materialFit"], 6)
                  problems.append("视频叙事缺少 bgmDirection")

              if not scenes:
                  scores["materialFit"] = min(scores["materialFit"], 5)
                  problems.append("视频镜头脚本为空")

              for index, scene in enumerate(scenes):
                  if not isinstance(scene, dict):
                      scores["materialFit"] = min(scores["materialFit"], 5)
                      problems.append(f"第 {index + 1} 个视频场景不是对象")
                      continue

                  scene_no = scene.get("sceneNo", index + 1)
                  scene_type = scene.get("sceneType")
                  if scene_type not in ["口播", "素材", "文字卡"]:
                      scores["materialFit"] = min(scores["materialFit"], 5)
                      problems.append(f"场景 {scene_no} sceneType 非法或缺失")
                      continue

                  if scene_type != "文字卡" and not str(scene.get("visualDescription") or "").strip():
                      scores["materialFit"] = min(scores["materialFit"], 6)
                      problems.append(f"场景 {scene_no} 缺少具体 visualDescription")

                  if scene_type == "口播":
                      guide = scene.get("filmingGuide")
                      if not isinstance(guide, dict):
                          scores["materialFit"] = min(scores["materialFit"], 5)
                          problems.append(f"口播场景 {scene_no} 缺少 filmingGuide")
                      else:
                          if not str(guide.get("location") or "").strip():
                              scores["materialFit"] = min(scores["materialFit"], 6)
                              problems.append(f"口播场景 {scene_no} 缺少拍摄地点")
                          if not as_list(guide.get("tips")):
                              scores["materialFit"] = min(scores["materialFit"], 6)
                              problems.append(f"口播场景 {scene_no} 缺少实操 tips")
                      if not str(scene.get("voiceover") or "").strip():
                          scores["materialFit"] = min(scores["materialFit"], 5)
                          problems.append(f"口播场景 {scene_no} 缺少 voiceover 台词")

                  if scene_type == "素材":
                      if not str(scene.get("assetQuery") or "").strip():
                          scores["materialFit"] = min(scores["materialFit"], 5)
                          problems.append(f"素材场景 {scene_no} 缺少 assetQuery")
                      if not str(scene.get("fallbackVisual") or "").strip():
                          scores["materialFit"] = min(scores["materialFit"], 6)
                          problems.append(f"素材场景 {scene_no} 缺少 fallbackVisual")

                  if scene_type == "文字卡" and not str(scene.get("subtitle") or "").strip():
                      scores["materialFit"] = min(scores["materialFit"], 5)
                      problems.append(f"文字卡场景 {scene_no} 缺少 subtitle")

              member_tasks = as_list((video_delivery.get("memberDelivery") or {}).get("tasks") if isinstance(video_delivery.get("memberDelivery"), dict) else [])
              filming_scene_count = len([scene for scene in scenes if isinstance(scene, dict) and scene.get("sceneType") == "口播"])
              if filming_scene_count and len(member_tasks) != filming_scene_count:
                  scores["materialFit"] = min(scores["materialFit"], 6)
                  problems.append("memberDelivery.tasks 与口播场景数量不一致")

              worker = video_delivery.get("workerDelivery") if isinstance(video_delivery.get("workerDelivery"), dict) else {}
              asset_scene_count = len([scene for scene in scenes if isinstance(scene, dict) and scene.get("sceneType") == "素材"])
              if asset_scene_count and not non_empty(worker.get("teamAssetQueries")):
                  scores["materialFit"] = min(scores["materialFit"], 6)
                  problems.append("存在素材场景，但 workerDelivery.teamAssetQueries 为空")

              passed = all(value >= 7 for value in scores.values()) and not red_flags and not missing_inputs and not problems

              out = {
                  "scores": scores,
                  "pass": passed,
                  "needsRewrite": needs_rewrite,
                  "riskTerms": risk_hits,
                  "problems": problems,
                  "revisionSuggestions": revision_suggestions,
                  "redFlags": red_flags,
                  "missingInputs": missing_inputs,
              }
              return {
                  "text": json.dumps(out, ensure_ascii=False),
                  "needs_rewrite": "true" if needs_rewrite else "false",
                  "risk_terms": "、".join(risk_hits),
              }
