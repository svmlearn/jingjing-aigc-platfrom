            12. 不要规划“市场正在发生变化、市场回暖、需求回升、越来越受欢迎、机会来了、实现居住梦想”等宏观判断；除非输入明确给出数据。可改成“最近有客户重新问起”“适合先结合预算和用途看一下”。

