    - data:
        code: "import json\nimport re\n\nRISK_TERMS = [\n    \"投资回报率高\", \"租金回报高\"\
          , \"收益稳定\", \"稳赚\", \"保值增值\", \"闭眼买\", \"错过后悔\",\n    \"满租\", \"租金区间\",\
          \ \"租金回报\", \"投资属性\", \"资产回报\", \"低位价格\", \"价格错位\",\n    \"收租\", \"贴月供\"\
          , \"租出去\", \"保租\", \"保回报\", \"确定兑现\", \"运营成熟验证\"\n]\n\nINTERNAL_RISK_LIST_KEYS\
          \ = {\n    \"riskTerms\",\n    \"mustAvoidClaims\",\n    \"mustReviewBeforePublish\"\
          \n}\n\nRISK_NOTE_KEYS = {\"riskNotes\"}\n\ndef strip_think(text):\n    if\
          \ not isinstance(text, str):\n        return text\n    if \"</think>\" in\
          \ text:\n        text = text.rsplit(\"</think>\", 1)[-1]\n    text = re.sub(r\"\
          (?is)<think>.*?</think>\", \"\", text)\n    return text.strip()\n\ndef clean_json(value):\n\
          \    text = strip_think((value or \"\").strip())\n    if text.startswith(\"\
          ```\"):\n        text = re.sub(r\"^```(?:json)?\\s*\", \"\", text)\n   \
          \     text = re.sub(r\"\\s*```$\", \"\", text)\n    return text\n\ndef parse_obj(value):\n\
          \    if isinstance(value, dict):\n        return value\n    if not isinstance(value,\
          \ str):\n        return {}\n\n    text = clean_json(value)\n    if \"</think>\"\
          \ in text:\n        text = text.rsplit(\"</think>\", 1)[-1].strip()\n\n\
          \    for candidate in [text] + [text[index:].strip() for index, char in\
          \ enumerate(text) if char == \"{\"]:\n        try:\n            parsed =\
          \ json.loads(clean_json(candidate))\n            return parsed if isinstance(parsed,\
          \ dict) else {}\n        except Exception:\n            continue\n    return\
          \ {}\n\ndef as_list(value):\n    return value if isinstance(value, list)\
          \ else []\n\ndef contains_risk(value):\n    text = str(value or \"\")\n\
          \    return any(term in text for term in RISK_TERMS)\n\ndef scrub_risk_text(text):\n\
          \    text = strip_think(str(text or \"\"))\n    for term in sorted(RISK_TERMS,\
          \ key=len, reverse=True):\n        text = text.replace(term, \"合规敏感表述\"\
          )\n    text = re.sub(r\"(合规敏感表述[、,，/\\s]*){2,}\", \"合规敏感表述\", text)\n  \
          \  text = text.replace(\"如合规敏感表述等\", \"相关表述\")\n    text = text.replace(\"\
          例如合规敏感表述\", \"相关表述\")\n    text = text.replace(\"已过滤风险词：合规敏感表述\", \"已处理合规风险表述\"\
          )\n    return text.strip()\n\ndef sanitize_public_output(value, key=\"\"\
          ):\n    if isinstance(value, dict):\n        cleaned = {}\n        for child_key,\
          \ child_value in value.items():\n            if child_key in INTERNAL_RISK_LIST_KEYS:\n\
          \                cleaned[child_key] = []\n            elif child_key in\
          \ RISK_NOTE_KEYS:\n                cleaned[child_key] = []\n           \
          \ else:\n                cleaned[child_key] = sanitize_public_output(child_value,\
          \ child_key)\n        return cleaned\n\n    if isinstance(value, list):\n\
          \        cleaned = []\n        for item in value:\n            if key in\
          \ INTERNAL_RISK_LIST_KEYS or key in RISK_NOTE_KEYS:\n                if\
          \ contains_risk(item):\n                    continue\n            cleaned.append(sanitize_public_output(item,\
          \ key))\n        return cleaned\n\n    if isinstance(value, str):\n    \
          \    if contains_risk(value) or \"<think>\" in value or \"</think>\" in\
          \ value:\n            return scrub_risk_text(value)\n        return value\n\
          \n    return value\n\ndef is_article_package(value):\n    return isinstance(value,\
          \ dict) and (\n        \"copyReadyText\" in value or \"body\" in value or\
          \ \"selectedTitle\" in value or \"contentBlocks\" in value\n    )\n\ndef\
          \ is_video_script(value):\n    return isinstance(value, dict) and (\n  \
          \      isinstance(value.get(\"scenes\"), list) or isinstance(value.get(\"\
          narrative\"), dict) or \"storyOutline\" in value\n    )\n\ndef extract_article_bundle(value):\n\
          \    obj = parse_obj(value)\n    if is_article_package(obj.get(\"articlePackage\"\
          )):\n        return obj.get(\"articlePackage\", {}), obj.get(\"titleStrategy\"\
          , {}) if isinstance(obj.get(\"titleStrategy\"), dict) else {}\n    if is_article_package(obj):\n\
          \        return obj, {}\n    return {}, {}\n\ndef extract_video_delivery(value):\n\
          \    obj = parse_obj(value)\n    if is_video_script(obj.get(\"videoScript\"\
          )):\n        return {\n            \"videoScript\": obj.get(\"videoScript\"\
          , {}),\n            \"memberDelivery\": obj.get(\"memberDelivery\", {}),\n\
          \            \"workerDelivery\": obj.get(\"workerDelivery\", {}),\n    \
          \    }\n    if is_video_script(obj):\n        return {\n            \"videoScript\"\
          : obj,\n            \"memberDelivery\": {},\n            \"workerDelivery\"\
          : {},\n        }\n    return {\n        \"videoScript\": {},\n        \"\
          memberDelivery\": {},\n        \"workerDelivery\": {},\n    }\n\ndef compact_image_refs(article):\n\
          \    refs = []\n    for item in as_list(article.get(\"imageMatches\")):\n\
          \        if not isinstance(item, dict):\n            continue\n        refs.append({\n\
          \            \"assetId\": item.get(\"assetId\", \"\"),\n            \"title\"\
          : item.get(\"title\", \"\")\n        })\n    return refs\n\ndef normalize_quality(quality):\n\
          \    if not quality:\n        return {\n            \"scores\": {},\n  \
          \          \"pass\": False,\n            \"problems\": [\"质量评审无法解析\"],\n\
          \            \"revisionSuggestions\": [],\n            \"redFlags\": [],\n\
          \            \"missingInputs\": [],\n            \"needsRewrite\": False,\n\
          \            \"riskTerms\": []\n        }\n\n    quality.setdefault(\"scores\"\
          , {})\n    quality.setdefault(\"problems\", [])\n    quality.setdefault(\"\
          revisionSuggestions\", [])\n    quality.setdefault(\"redFlags\", [])\n \
          \   quality.setdefault(\"missingInputs\", [])\n    quality.setdefault(\"\
          needsRewrite\", False)\n    quality.setdefault(\"riskTerms\", [])\n    return\
          \ quality\n\ndef mark_repair_if_needed(quality):\n    if not quality.get(\"\
          needsRewrite\"):\n        return quality\n\n    quality[\"preRepairPass\"\
          ] = quality.get(\"pass\", False)\n    quality[\"autoRewritten\"] = True\n\
          \    quality[\"repairPolicy\"] = \"validator_risk_terms_minimal_rewrite\"\
          \n\n    scores = quality.get(\"scores\") or {}\n    scores[\"compliance\"\
          ] = max(float(scores.get(\"compliance\", 0) or 0), 8)\n    quality[\"scores\"\
          ] = scores\n\n    risk_problem_keywords = [\"风险承诺\", \"价格趋势\", \"命中风险词\"\
          ]\n    quality[\"problems\"] = [\n        item for item in as_list(quality.get(\"\
          problems\"))\n        if not any(keyword in str(item) for keyword in risk_problem_keywords)\n\
          \    ]\n    quality[\"redFlags\"] = [\n        item for item in as_list(quality.get(\"\
          redFlags\"))\n        if \"命中风险词\" not in str(item)\n    ]\n    quality[\"\
          revisionSuggestions\"] = [\n        item for item in as_list(quality.get(\"\
          revisionSuggestions\"))\n        if not any(keyword in str(item) for keyword\
          \ in risk_problem_keywords)\n    ]\n    quality[\"pass\"] = (\n        all(float(value\
          \ or 0) >= 7 for value in scores.values())\n        and not quality[\"problems\"\
          ]\n        and not quality[\"redFlags\"]\n        and not as_list(quality.get(\"\
          missingInputs\"))\n    )\n    return quality\n\ndef main(article_package,\
          \ video_script, quality_review_text: str, task_understanding_text: str,\
          \ creative_strategy_text: str) -> dict:\n    article, title_strategy = extract_article_bundle(article_package)\n\
          \    video_delivery = extract_video_delivery(video_script)\n    task_understanding\
          \ = parse_obj(task_understanding_text)\n    creative_strategy = parse_obj(creative_strategy_text)\n\
          \    quality = normalize_quality(parse_obj(quality_review_text))\n\n   \
          \ degradation_notices = []\n    if not parse_obj(quality_review_text):\n\
          \        degradation_notices.append(\"质量评审无法解析\")\n\n    strategy_notices\
          \ = creative_strategy.get(\"degradationNotices\")\n    if isinstance(strategy_notices,\
          \ list):\n        degradation_notices.extend(strategy_notices)\n\n    quality\
          \ = mark_repair_if_needed(quality)\n    if quality.get(\"autoRewritten\"\
          ):\n        degradation_notices.append(\"已根据质量门禁命中风险词进行自动改写\")\n\n    used_viral\
          \ = creative_strategy.get(\"usedViralRefs\")\n    if not used_viral:\n \
          \       pattern = creative_strategy.get(\"viralPatternUsed\")\n        used_viral\
          \ = [pattern] if isinstance(pattern, dict) else []\n\n    result = {\n \
          \       \"workflowVersion\": \"content_calendar_generation_poc_v3_article_video_split\"\
          ,\n        \"articlePackage\": article,\n        \"titleStrategy\": title_strategy,\n\
          \        \"videoScript\": video_delivery.get(\"videoScript\", {}),\n   \
          \     \"memberDelivery\": video_delivery.get(\"memberDelivery\", {}),\n\
          \        \"workerDelivery\": video_delivery.get(\"workerDelivery\", {}),\n\
          \        \"qualityReview\": quality,\n        \"trace\": {\n           \
          \ \"taskUnderstanding\": task_understanding,\n            \"creativeStrategy\"\
          : creative_strategy,\n            \"usedKnowledgeRefs\": creative_strategy.get(\"\
          mustUseFacts\") or creative_strategy.get(\"usedKnowledgeRefs\") or [],\n\
          \            \"usedViralRefs\": used_viral,\n            \"usedImageAssets\"\
          : compact_image_refs(article),\n            \"degradationNotices\": degradation_notices\n\
          \        },\n        \"saveHints\": {\n            \"contentDraftInputSnapshotKeys\"\
          : [\n                \"source\",\n                \"teamCalendarTask\",\n\
          \                \"knowledgeRefs\",\n                \"viralRefs\",\n  \
          \              \"imageAssetRefs\",\n                \"qualityReview\"\n\
          \            ]\n        }\n    }\n    result = sanitize_public_output(result)\n\
          \    return {\"final_result_json\": json.dumps(result, ensure_ascii=False)}\n"
