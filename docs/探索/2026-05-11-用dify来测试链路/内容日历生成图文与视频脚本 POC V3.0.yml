          \ = text.rsplit(\"</think>\", 1)[-1]\n    text = re.sub(r\"(?is)<think>.*?</think>\"\
          , \"\", text)\n    return text.strip()\n\ndef clean_json(value):\n    text\
          \ = strip_think((value or \"\").strip())\n    if text.startswith(\"```\"\
          ):\n        text = re.sub(r\"^```(?:json)?\\s*\", \"\", text)\n        text\
          \ = re.sub(r\"\\s*```$\", \"\", text)\n    return text\n\ndef parse_obj(value):\n\
          \    if isinstance(value, dict):\n        return value\n    if not isinstance(value,\
          \ str):\n        return {}\n    text = clean_json(value)\n    for candidate\
          \ in [text] + [text[index:].strip() for index, char in enumerate(text) if\
          \ char == \"{\"]:\n        try:\n            parsed = json.loads(clean_json(candidate))\n\
          \            return parsed if isinstance(parsed, dict) else {}\n       \
          \ except Exception:\n            continue\n    return {}\n\ndef as_list(value):\n\
          \    return value if isinstance(value, list) else []\n\ndef main(title_cover:\
          \ str, article_body: str) -> dict:\n    \"\"\"\n    从节点①②的输出中编译图文内容包。\n\
          \    职责：拼接、提取、格式化。不做任何创作。\n    \"\"\"\n    tc = parse_obj(title_cover)\n\
          \    body = parse_obj(article_body)\n\n    blocks = as_list(body.get(\"\
          contentBlocks\"))\n    hashtags = as_list(body.get(\"hashtags\"))\n    cta\
          \ = body.get(\"cta\", \"\")\n\n    # === 拼接纯文本 body ===\n    body_text =\
          \ \"\\n\\n\".join([str(b.get(\"text\", \"\")).strip() for b in blocks if\
          \ isinstance(b, dict) and str(b.get(\"text\", \"\")).strip()])\n\n    #\
          \ === 拼接 copyReadyText ===\n    hashtag_str = \" \".join(hashtags)\n   \
          \ copy_parts = [tc.get(\"selectedTitle\", \"\"), \"\", body_text]\n    if\
          \ hashtag_str:\n        copy_parts.extend([\"\", hashtag_str])\n    copy_ready_text\
          \ = \"\\n\".join(copy_parts)\n\n    # === 提取配图信息 ===\n    image_matches\
          \ = []\n    image_briefs = []\n    for b in blocks:\n        if not isinstance(b,\
          \ dict):\n            continue\n        image_match = b.get(\"imageMatch\"\
          )\n        if isinstance(image_match, dict):\n            image_matches.append({\n\
          \                \"blockNo\": b.get(\"blockNo\", \"\"),\n              \
          \  \"assetId\": image_match.get(\"assetId\", \"\"),\n                \"\
          title\": image_match.get(\"title\", \"\"),\n                \"usage\": image_match.get(\"\
          usage\", \"\")\n            })\n        if b.get(\"imageBrief\"):\n    \
          \        image_briefs.append(str(b.get(\"imageBrief\", \"\")))\n\n    title_items\
          \ = as_list(tc.get(\"titles\"))\n    title_texts = [item.get(\"text\", \"\
          \") for item in title_items if isinstance(item, dict) and item.get(\"text\"\
          )]\n\n    # === 合并输出（兼容现有 articlePackage 格式）===\n    return {\n        \"\
          result\": json.dumps({\n            \"articlePackage\": {\n            \
          \    \"titles\": title_texts,\n                \"selectedTitle\": tc.get(\"\
          selectedTitle\", \"\"),\n                \"coverCopy\": tc.get(\"selectedCoverCopy\"\
          , \"\"),\n                \"body\": body_text,\n                \"contentBlocks\"\
          : blocks,\n                \"hashtags\": hashtags,\n                \"cta\"\
          : cta,\n                \"imageMatches\": image_matches,\n             \
