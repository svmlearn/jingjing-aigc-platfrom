name: jingjing-video-worker

services:
  openstoryline-engine:
    build:
      context: ./openstoryline
    container_name: openstoryline-engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OPENSTORYLINE_HOST: 0.0.0.0
      OPENSTORYLINE_PORT: 8000
      OPENSTORYLINE_MCP_PORT: 8001
      OPENSTORYLINE_MODELS_DIR: /srv/jingjing-video-worker/models
      OPENSTORYLINE_OUTPUTS_DIR: /srv/jingjing-video-worker/outputs
      OPENSTORYLINE_ENGINE_ADAPTER: ${OPENSTORYLINE_ENGINE_ADAPTER:-fire_red}
      FIRERED_OPENSTORYLINE_BASE_URL: ${FIRERED_OPENSTORYLINE_BASE_URL:-http://firered-openstoryline:7860}
      FIRERED_RUN_TIMEOUT_SECONDS: ${FIRERED_RUN_TIMEOUT_SECONDS:-900}
      FIRERED_STREAM_IDLE_TIMEOUT_SECONDS: ${FIRERED_STREAM_IDLE_TIMEOUT_SECONDS:-180}
      FIRERED_PROVIDER_KEY: ${FIRERED_PROVIDER_KEY:-}
      OPENSTORYLINE_TTS_PROVIDER: ${OPENSTORYLINE_TTS_PROVIDER:-bytedance_bigtts}
      OPENSTORYLINE_ASR_PROVIDER: ${OPENSTORYLINE_ASR_PROVIDER:-aliyun_paraformer}
      ALIYUN_ASR_MODEL: ${ALIYUN_ASR_MODEL:-paraformer-realtime-v2}
      ALIYUN_ASR_API_KEY: ${ALIYUN_ASR_API_KEY:-}
      ALIYUN_ASR_WORKSPACE: ${ALIYUN_ASR_WORKSPACE:-}
      TTS_302_BASE_URL: ${TTS_302_BASE_URL:-https://api.302.ai}
      TTS_302_API_KEY: ${TTS_302_API_KEY:-}
      TTS_MINIMAX_BASE_URL: ${TTS_MINIMAX_BASE_URL:-https://api.minimax.io}
      TTS_MINIMAX_API_KEY: ${TTS_MINIMAX_API_KEY:-}
      TTS_RUNNINGHUB_BASE_URL: ${TTS_RUNNINGHUB_BASE_URL:-https://www.runninghub.cn}
      TTS_RUNNINGHUB_API_KEY: ${TTS_RUNNINGHUB_API_KEY:-}
      TTS_PIXELLE_CLONE_BASE_URL: ${TTS_PIXELLE_CLONE_BASE_URL:-https://www.runninghub.cn}
      TTS_PIXELLE_CLONE_API_KEY: ${TTS_PIXELLE_CLONE_API_KEY:-}
      TTS_BYTEDANCE_BIGTTS_BASE_URL: ${TTS_BYTEDANCE_BIGTTS_BASE_URL:-https://openspeech.bytedance.com}
      TTS_BYTEDANCE_BIGTTS_UID: ${TTS_BYTEDANCE_BIGTTS_UID:-openstoryline}
      TTS_BYTEDANCE_BIGTTS_APPID: ${TTS_BYTEDANCE_BIGTTS_APPID:-}
      TTS_BYTEDANCE_BIGTTS_ACCESS_KEY: ${TTS_BYTEDANCE_BIGTTS_ACCESS_KEY:-}
      TTS_BYTEDANCE_BIGTTS_RESOURCE_ID: ${TTS_BYTEDANCE_BIGTTS_RESOURCE_ID:-}
      TTS_BYTEDANCE_BIGTTS_SPEAKER: ${TTS_BYTEDANCE_BIGTTS_SPEAKER:-}
      AI_TRANSITION_DASHSCOPE_API_KEY: ${AI_TRANSITION_DASHSCOPE_API_KEY:-}
      AI_TRANSITION_MINIMAX_API_KEY: ${AI_TRANSITION_MINIMAX_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      FISH_AUDIO_API_KEY: ${FISH_AUDIO_API_KEY:-}
    volumes:
      - ${VIDEO_WORKER_HOST_ROOT:-/srv/jingjing-video-worker}/tmp:/srv/jingjing-video-worker/tmp
      - ${VIDEO_WORKER_HOST_ROOT:-/srv/jingjing-video-worker}/models:/srv/jingjing-video-worker/models
      - ${VIDEO_WORKER_HOST_ROOT:-/srv/jingjing-video-worker}/outputs:/srv/jingjing-video-worker/outputs
    expose:
      - "8000"
      - "8001"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready').read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  firered-openstoryline:
    profiles:
      - firered
    build:
      context: ./openstoryline/firered
      args:
        DOWNLOAD_FIRERED_ASSETS: ${DOWNLOAD_FIRERED_BUILD_ASSETS:-false}
    container_name: firered-openstoryline
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 7860
      DOWNLOAD_FIRERED_ASSETS: ${DOWNLOAD_FIRERED_ASSETS:-true}
      OPENSTORYLINE_LLM_MODEL: ${OPENSTORYLINE_LLM_MODEL:-}
      OPENSTORYLINE_LLM_BASE_URL: ${OPENSTORYLINE_LLM_BASE_URL:-}
      OPENSTORYLINE_LLM_API_KEY: ${OPENSTORYLINE_LLM_API_KEY:-}
      OPENSTORYLINE_VLM_MODEL: ${OPENSTORYLINE_VLM_MODEL:-}
      OPENSTORYLINE_VLM_BASE_URL: ${OPENSTORYLINE_VLM_BASE_URL:-}
      OPENSTORYLINE_VLM_API_KEY: ${OPENSTORYLINE_VLM_API_KEY:-}
      FIRERED_PROVIDER_KEY: ${FIRERED_PROVIDER_KEY:-}
      OPENSTORYLINE_TTS_PROVIDER: ${OPENSTORYLINE_TTS_PROVIDER:-bytedance_bigtts}
      OPENSTORYLINE_ASR_PROVIDER: ${OPENSTORYLINE_ASR_PROVIDER:-aliyun_paraformer}
      ALIYUN_ASR_MODEL: ${ALIYUN_ASR_MODEL:-paraformer-realtime-v2}
      ALIYUN_ASR_API_KEY: ${ALIYUN_ASR_API_KEY:-}
      ALIYUN_ASR_WORKSPACE: ${ALIYUN_ASR_WORKSPACE:-}
      TTS_302_BASE_URL: ${TTS_302_BASE_URL:-https://api.302.ai}
      TTS_302_API_KEY: ${TTS_302_API_KEY:-}
      TTS_MINIMAX_BASE_URL: ${TTS_MINIMAX_BASE_URL:-https://api.minimax.io}
      TTS_MINIMAX_API_KEY: ${TTS_MINIMAX_API_KEY:-}
      TTS_RUNNINGHUB_BASE_URL: ${TTS_RUNNINGHUB_BASE_URL:-https://www.runninghub.cn}
      TTS_RUNNINGHUB_API_KEY: ${TTS_RUNNINGHUB_API_KEY:-}
      TTS_PIXELLE_CLONE_BASE_URL: ${TTS_PIXELLE_CLONE_BASE_URL:-https://www.runninghub.cn}
      TTS_PIXELLE_CLONE_API_KEY: ${TTS_PIXELLE_CLONE_API_KEY:-}
      TTS_BYTEDANCE_BIGTTS_BASE_URL: ${TTS_BYTEDANCE_BIGTTS_BASE_URL:-https://openspeech.bytedance.com}
      TTS_BYTEDANCE_BIGTTS_UID: ${TTS_BYTEDANCE_BIGTTS_UID:-openstoryline}
      TTS_BYTEDANCE_BIGTTS_APPID: ${TTS_BYTEDANCE_BIGTTS_APPID:-}
      TTS_BYTEDANCE_BIGTTS_ACCESS_KEY: ${TTS_BYTEDANCE_BIGTTS_ACCESS_KEY:-}
      TTS_BYTEDANCE_BIGTTS_RESOURCE_ID: ${TTS_BYTEDANCE_BIGTTS_RESOURCE_ID:-}
      TTS_BYTEDANCE_BIGTTS_SPEAKER: ${TTS_BYTEDANCE_BIGTTS_SPEAKER:-}
      AI_TRANSITION_DASHSCOPE_API_KEY: ${AI_TRANSITION_DASHSCOPE_API_KEY:-}
      AI_TRANSITION_MINIMAX_API_KEY: ${AI_TRANSITION_MINIMAX_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      FISH_AUDIO_API_KEY: ${FISH_AUDIO_API_KEY:-}
    volumes:
      - ${VIDEO_WORKER_HOST_ROOT:-/srv/jingjing-video-worker}/tmp:/srv/jingjing-video-worker/tmp
      - ${VIDEO_WORKER_HOST_ROOT:-/srv/jingjing-video-worker}/outputs:/srv/jingjing-video-worker/outputs
      - ${VIDEO_WORKER_HOST_ROOT:-/srv/jingjing-video-worker}/firered/.storyline:/app/.storyline
      - ${VIDEO_WORKER_HOST_ROOT:-/srv/jingjing-video-worker}/firered/resource:/app/resource
      - ${VIDEO_WORKER_HOST_ROOT:-/srv/jingjing-video-worker}/firered/outputs:/app/outputs
    expose:
      - "7860"
      - "8001"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/ready').read()"
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  video-worker:
    build:
      context: ./worker
    container_name: video-worker
    restart: unless-stopped
    depends_on:
      openstoryline-engine:
        condition: service_healthy
    env_file:
      - .env
    environment:
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:-}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      WORKER_STORAGE_PROVIDER: ${WORKER_STORAGE_PROVIDER:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}
      WORKER_STORAGE_RESULT_PREFIX: ${WORKER_STORAGE_RESULT_PREFIX:-}
      WORKER_COS_SECRET_ID: ${WORKER_COS_SECRET_ID:-}
      WORKER_COS_SECRET_KEY: ${WORKER_COS_SECRET_KEY:-}
      WORKER_COS_BUCKET: ${WORKER_COS_BUCKET:-}
      WORKER_COS_REGION: ${WORKER_COS_REGION:-}
      WORKER_COS_RESULT_PREFIX: ${WORKER_COS_RESULT_PREFIX:-video-results}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-}
      WORKER_ALIYUN_OSS_ACCESS_KEY_ID: ${WORKER_ALIYUN_OSS_ACCESS_KEY_ID:-}
      WORKER_ALIYUN_OSS_ACCESS_KEY_SECRET: ${WORKER_ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      WORKER_ALIYUN_OSS_BUCKET: ${WORKER_ALIYUN_OSS_BUCKET:-}
      WORKER_ALIYUN_OSS_REGION: ${WORKER_ALIYUN_OSS_REGION:-}
      WORKER_ALIYUN_OSS_ENDPOINT: ${WORKER_ALIYUN_OSS_ENDPOINT:-}
      WORKER_ALIYUN_OSS_RESULT_PREFIX: ${WORKER_ALIYUN_OSS_RESULT_PREFIX:-}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:-}
      ALIYUN_OSS_REGION: ${ALIYUN_OSS_REGION:-}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      WORKER_ID: ${WORKER_ID:-}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-10}
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-1}
      VIDEO_JOB_STALE_MINUTES: ${VIDEO_JOB_STALE_MINUTES:-120}
      WORKER_TEMP_ROOT: ${WORKER_TEMP_ROOT:-/srv/jingjing-video-worker/tmp}
      WORKER_MODELS_ROOT: ${WORKER_MODELS_ROOT:-/srv/jingjing-video-worker/models}
      WORKER_OUTPUT_ROOT: ${WORKER_OUTPUT_ROOT:-/srv/jingjing-video-worker/outputs}
      OPENSTORYLINE_BASE_URL: ${OPENSTORYLINE_BASE_URL:-http://openstoryline-engine:8000}
      OPENSTORYLINE_TIMEOUT_SECONDS: ${OPENSTORYLINE_TIMEOUT_SECONDS:-1800}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      FISH_AUDIO_API_KEY: ${FISH_AUDIO_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${VIDEO_WORKER_HOST_ROOT:-/srv/jingjing-video-worker}/tmp:/srv/jingjing-video-worker/tmp
      - ${VIDEO_WORKER_HOST_ROOT:-/srv/jingjing-video-worker}/models:/srv/jingjing-video-worker/models
      - ${VIDEO_WORKER_HOST_ROOT:-/srv/jingjing-video-worker}/outputs:/srv/jingjing-video-worker/outputs
