# ============= 开发者选项 / Developer Options ===============
[developer]
developer_mode = true
print_context = false # 在拦截器打印模型拿到的全部上下文，会很长 / Print full context in interceptor (output will be very long)

# ============= 项目路径 / Project Paths ======================
[project]
media_dir = "./outputs/media"
bgm_dir = "./resource/bgms"
outputs_dir = "./outputs"

# ============= 模型配置 for user / Model Config for User =============
[llm]
model = "${OPENSTORYLINE_LLM_MODEL:-glm-4.6}"
base_url = "${OPENSTORYLINE_LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}"
api_key = "${OPENSTORYLINE_LLM_API_KEY:-}"
temperature = 0.1
timeout = 420.0
max_retries = 0

[vlm]
model = "${OPENSTORYLINE_VLM_MODEL:-glm-4.6v}"
base_url = "${OPENSTORYLINE_VLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}"
api_key = "${OPENSTORYLINE_VLM_API_KEY:-}"
timeout = 60.0
temperature = 0.1
max_retries = 2

# ============= MCP Server 相关 / MCP Server Related =============
[local_mcp_server]
server_name = "storyline"
server_cache_dir = ".storyline/.server_cache"
server_transport = "streamable-http"
url_scheme = "http"
connect_host = "127.0.0.1"
inline_media = "auto"
port = 8001
path = "/mcp"

json_response = true
stateless_http = false
timeout = 600
available_node_pkgs = [
    "open_storyline.nodes.core_nodes.load_media",
    "open_storyline.nodes.core_nodes.split_shots",
    "open_storyline.nodes.core_nodes.understand_clips",
    "open_storyline.nodes.core_nodes.filter_clips",
    "open_storyline.nodes.core_nodes.group_clips",
    "open_storyline.nodes.core_nodes.generate_script",
    "open_storyline.nodes.core_nodes.recommend_effects",
    "open_storyline.nodes.core_nodes.plan_timeline",
    "open_storyline.nodes.core_nodes.plan_timeline_pro",
    "open_storyline.nodes.core_nodes.render_video",
]
available_nodes = [
    "LoadMediaNode", "SplitShotsNode", "UnderstandClipsNode", "FilterClipsNode",
    "GroupClipsNode", "GenerateScriptNode", "RecommendTransitionNode", "RecommendTextNode",
    "PlanTimelineNode", "PlanTimelineProNode", "RenderVideoNode",
]

# =========== skills ==========
[skills]
skill_dir = "./.storyline/skills"

# =========== pexels ==========
[search_media]
pexels_api_key = "${PEXELS_API_KEY:-}"
pexels_base_url = "${PRIVATE_PEXELS_BASE_URL:-}"

# ============= 镜头分割 / Shot Segmentation =============
[split_shots]
transnet_weights = ".storyline/models/transnetv2-pytorch-weights.pth"
transnet_device = "cpu"

# ============= 视频视觉理解 / Video Visual Understanding =============
[understand_clips]
sample_fps = 2.0
max_frames = 64

# ============= 镜头分组 / Clip Grouping =============
[group_clips]
base_max_tokens = 4096
tokens_per_clip = 48
max_tokens_cap = 16384
retry_token_step = 2048
max_parse_retries = 2

# ============= 文案模板 / Script Templates =============
[script_template]
script_template_dir = "./resource/script_templates"
script_template_info_path = "./resource/script_templates/meta.json"

# ============= 配音生成 / Voiceover Generation ===================
[generate_voiceover]
tts_provider_params_path = "./resource/tts/tts_providers.json"

[generate_voiceover.providers.302]
base_url = "${TTS_302_BASE_URL:-https://api.302.ai}"
api_key = "${TTS_302_API_KEY:-}"

[generate_voiceover.providers.bytedance]
uid = "${TTS_BYTEDANCE_UID:-YOUR_BYTEDANCE_UID}"
appid = "${TTS_BYTEDANCE_APPID:-YOUR_BYTEDANCE_APPID}"
access_token = "${TTS_BYTEDANCE_ACCESS_TOKEN:-YOUR_BYTEDANCE_ACCESS_TOKEN}"

[generate_voiceover.providers.bytedance_bigtts]
label = "ByteDance Big Model"
base_url = "${TTS_BYTEDANCE_BIGTTS_BASE_URL:-https://openspeech.bytedance.com}"
uid = "${TTS_BYTEDANCE_BIGTTS_UID:-openstoryline}"
appid = "${TTS_BYTEDANCE_BIGTTS_APPID:-}"
access_key = "${TTS_BYTEDANCE_BIGTTS_ACCESS_KEY:-}"
resource_id = "${TTS_BYTEDANCE_BIGTTS_RESOURCE_ID:-}"
speaker = "${TTS_BYTEDANCE_BIGTTS_SPEAKER:-}"

[generate_voiceover.providers.minimax]
base_url = "${TTS_MINIMAX_BASE_URL:-https://api.minimax.io}"
api_key = "${TTS_MINIMAX_API_KEY:-}"

[generate_voiceover.providers.runninghub]
base_url = "${TTS_RUNNINGHUB_BASE_URL:-https://www.runninghub.cn}"
api_key = "${TTS_RUNNINGHUB_API_KEY:-}"
workflow_id = "${RUNNINGHUB_TTS_EDGE_WORKFLOW_ID:-1983513964837543938}"

[generate_voiceover.providers.pixelle_clone]
base_url = "${TTS_PIXELLE_CLONE_BASE_URL:-https://www.runninghub.cn}"
api_key = "${TTS_PIXELLE_CLONE_API_KEY:-}"
workflow_id = "${RUNNINGHUB_TTS_CLONE_WORKFLOW_ID:-1983718528991862786}"
timeout_seconds = 300
ref_audio = ""

# ============= AI 转场生成 / AI transition generation ===================
[generate_ai_transition]

[generate_ai_transition.providers.dashscope]
model_name = "wan2.2-kf2v-flash"
api_key = "${AI_TRANSITION_DASHSCOPE_API_KEY:-}"

[generate_ai_transition.providers.minimax]
model_name = "MiniMax-Hailuo-02"
api_key = "${AI_TRANSITION_MINIMAX_API_KEY:-}"

# ============= BGM选择 / BGM Selection ====================
[select_bgm]
sample_rate = 22050
hop_length = 2048
frame_length = 2048

# ============= 字体推荐 / Font Recommendation ====================
[recommend_text]
font_info_path = "resource/fonts/font_info.json"

# ============= 时间线组织 / Timeline Organization ====================
[plan_timeline]
beat_type_max = 1
title_duration = 0
bgm_loop = true
min_clip_duration = 1000
estimate_text_min = 1500
estimate_text_char_per_sec = 6.0
image_default_duration = 3000
group_margin_over_voiceover = 1000

[plan_timeline_pro]
min_single_text_duration = 200
max_text_duration = 5000
img_default_duration = 1500
min_group_margin = 1500
max_group_margin = 2000
min_clip_duration = 1000
tts_margin_mode = "random"
min_tts_margin = 300
max_tts_margin = 400
text_tts_offset_mode = "random"
min_text_tts_offset = 0
max_text_tts_offset = 0
long_short_text_duration = 3000
long_text_margin_rate = 0.0
short_text_margin_rate = 0.0
text_duration_mode = "with_tts"
is_text_beats = false
